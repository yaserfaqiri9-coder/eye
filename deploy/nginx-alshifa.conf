# Template: replace hospital.example with the real host name and certificate paths.
# Not yet exercised on a Linux server (see DEPLOYMENT.md).
limit_req_zone $binary_remote_addr zone=alshifa_login:10m rate=2r/s;

server {
    listen 80;
    server_name hospital.example;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name hospital.example;

    ssl_certificate     /etc/ssl/alshifa/fullchain.pem;
    ssl_certificate_key /etc/ssl/alshifa/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /var/www/alshifa;
    index index.html;

    # Must match the 10 MB limit enforced by the API, with room for the multipart envelope.
    client_max_body_size 11m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; connect-src 'self' wss://hospital.example; object-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;

    # Changes with the app but keeps its name, so it must never be cached long term.
    location = /boot-check.js {
        add_header Cache-Control "no-cache";
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /api/auth/login {
        limit_req zone=alshifa_login burst=20 nodelay;
        include /etc/nginx/alshifa-proxy.conf;
    }

    location /api/ {
        include /etc/nginx/alshifa-proxy.conf;
    }

    location /hubs/ {
        include /etc/nginx/alshifa-proxy.conf;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }

    # The health endpoint stays reachable only from the server itself.
    location = /health {
        allow 127.0.0.1;
        deny all;
        include /etc/nginx/alshifa-proxy.conf;
    }

    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
